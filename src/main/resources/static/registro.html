<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - Plataforma para Egresados</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card registro-card">
            <img src="img/logo.jpg" alt="Logo institución" class="logo-institucion" onerror="this.style.display='none'">
            <h1> Crear mi cuenta</h1>
            <form id="registroForm">
                <label for="nombreUsuario">Usuario</label>
                <input type="text" id="nombreUsuario" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" required>

                <label for="password2">Repetir contraseña</label>
                <input type="password" id="password2" required>

                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" required>

                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" required>

                <label for="email">Email</label>
                <input type="email" id="email">

                                <label for="colegio">Colegio</label>
                <input type="text" id="colegio" required placeholder="ej: Escuela Nacional N°1">

                <label for="anioEgreso">Año de egreso</label>
                <input type="number" id="anioEgreso" required min="2000" max="2100" placeholder="ej: 2026">

                <button type="submit">Crear cuenta</button>
                <p class="error-msg" id="errorMsg"></p>
            </form>
            <p class="link-secundario"><a href="login.html">Ya tengo cuenta, iniciar sesión</a></p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/registro.js"></script>
</body>
</html>
