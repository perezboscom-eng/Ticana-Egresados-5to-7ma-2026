<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proveedores - Plataforma para Egresados</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="app-header">
        <div class="marca">
            <img src="img/logo.jpg" alt="Logo institución" class="logo-institucion" onerror="this.style.display='none'">
            <div>
                <h1>Plataforma para Egresados</h1>
                <span class="subtitulo">Nombre de la Institución</span>
            </div>
        </div>
        <div class="user-info">
            <span id="saludoUsuario"></span>
            <a href="admin.html" id="linkAdmin" class="hidden">Administración</a>
            <button id="btnLogout">Cerrar sesión</button>
        </div>
    </header>

    <nav class="main-nav">
        <a href="index.html" class="nav-link">Inicio</a>
        <a href="eventos.html" class="nav-link">Eventos</a>
        <a href="proveedores.html" class="nav-link active">Proveedores</a>
    </nav>

    <main>
        <section class="panel panel--proveedores">
            <h2><svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="1"></rect><line x1="9" y1="6" x2="9" y2="6.01"></line><line x1="15" y1="6" x2="15" y2="6.01"></line><line x1="9" y1="10" x2="9" y2="10.01"></line><line x1="15" y1="10" x2="15" y2="10.01"></line><line x1="9" y1="14" x2="9" y2="14.01"></line><line x1="15" y1="14" x2="15" y2="14.01"></line><line x1="9" y1="18" x2="15" y2="18"></line></svg> Proveedores para tu evento</h2>
            <div class="tabs">
                <button class="cat-btn active" data-categoria="">Todos</button>
                <button class="cat-btn" data-categoria="salon">
                    <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7"></path><path d="M9 22V12h6v10"></path><path d="M21 22H3"></path></svg>
                    Salones
                </button>
                <button class="cat-btn" data-categoria="viaje">
                    <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    Viajes
                </button>
                <button class="cat-btn" data-categoria="buzos">
                    <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3l-4 4-4-4-6 4 3 4h2v10h10V11h2l3-4-6-4z"></path></svg>
                    Buzos
                </button>
                <button class="cat-btn" data-categoria="catering">
                    <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg>
                    Catering
                </button>
            </div>
            <div id="empresasGrid" class="empresa-grid">
                <p class="empty-msg">Cargando proveedores...</p>
            </div>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/iconos.js"></script>
    <script src="js/proveedores.js"></script>
</body>
</html>
